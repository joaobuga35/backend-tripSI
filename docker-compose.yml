# ║  TripSi — Local Development Infrastructure       ║
# ║  Usage: docker compose up -d                     ║
# ╚═══════════════════════════════════════════════════╝

services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsi-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-tripsi_dev}
      POSTGRES_USER: ${DB_USERNAME:-tripsi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripsi}
    volumes:
      - tripsi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripsi} -d ${DB_NAME:-tripsi_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tripsi-pgdata:
    driver: local
