# ╔══════════════════════════════════════════════╗
# ║  TripSi API — Test Profile                  ║
# ║  Testcontainers PostgreSQL + minimal logging ║
# ╚══════════════════════════════════════════════╝

spring:
  # Datasource is auto-configured by @ServiceConnection on the Testcontainers PostgreSQL
  # container declared in each test class — no manual url/driver here.
  jpa:
    show-sql: false

  # Spring AI — mock in tests
  ai:
    openai:
      api-key: sk-mock-test-key

  flyway:
    enabled: true

# ── Logging ──
logging:
  level:
    root: WARN
    com.tripsi.api: INFO
    org.testcontainers: INFO

# ── Swagger UI disabled in test ──
springdoc:
  swagger-ui:
    enabled: false

