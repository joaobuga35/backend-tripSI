# ╔═══════════════════════════════════════════════════════╗
# ║  TripSi API — Base Configuration                    ║
# ║  Profile-specific overrides in application-{env}.yml ║
# ╚═══════════════════════════════════════════════════════╝

spring:
  application:
    name: tripsi-api

  # Active profile — overridden by SPRING_PROFILES_ACTIVE env var
  profiles:
    active: dev

  # JPA — Hibernate validates schema, Flyway owns DDL
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Flyway — all schema changes via migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── Server ──
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ── API Documentation ──
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ── Application custom properties ──
tripsi:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
