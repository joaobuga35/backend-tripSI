# ╔══════════════════════════════════════════╗
# ║  TripSi API — Development Profile       ║
# ║  Local PostgreSQL + debug logging        ║
# ╚══════════════════════════════════════════╝

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tripsi_dev}
    username: ${DB_USERNAME:tripsi}
    password: ${DB_PASSWORD:tripsi}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring AI — disabled in dev (mock adapters used)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-mock-dev-key}

# ── Logging ──
logging:
  level:
    root: INFO
    com.tripsi.api: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ── Swagger UI enabled in dev ──
springdoc:
  swagger-ui:
    enabled: true
