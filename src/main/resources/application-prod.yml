# ╔═══════════════════════════════════════════════╗
# ║  TripSi API — Production Profile             ║
# ║  Cloud PostgreSQL + JSON logging + HTTPS      ║
# ╚═══════════════════════════════════════════════╝

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Spring AI — real provider
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

# ── Logging — JSON structured output ──
logging:
  level:
    root: WARN
    com.tripsi.api: INFO
    org.springframework.security: WARN

# ── Swagger UI disabled in prod ──
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ── Server — HTTPS enforced ──
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
